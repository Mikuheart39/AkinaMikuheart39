<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國三綜合練習題庫 - 線上測驗與解析系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#075985',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            background-color: #f8fafc;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

</head>
<body class="text-slate-800 flex flex-col min-h-screen">

    <!-- Header Navigation -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-brand-500 text-white flex items-center justify-center font-bold text-xl shadow-md shadow-brand-500/20">
                    建
                </div>
                <div>
                    <h1 class="font-bold text-slate-800 leading-tight">國三綜合練習題庫</h1>
                    <p class="text-xs text-slate-500">命題教師：陳冠準 • 共 25 題 (每題4分)</p>
                </div>
            </div>

            <!-- Mode Switch Buttons -->
            <div class="bg-slate-100 p-1 rounded-xl flex gap-1">
                <button id="modePracticeBtn" onclick="switchMode('practice')" class="px-3 py-1.5 rounded-lg text-sm font-medium transition-all duration-200 flex items-center gap-1.5 shadow-xs bg-white text-brand-600">
                    <i class="fa-solid fa-book-open"></i>
                    <span>練習模式</span>
                </button>
                <button id="modeExamBtn" onclick="switchMode('exam')" class="px-3 py-1.5 rounded-lg text-sm font-medium transition-all duration-200 flex items-center gap-1.5 text-slate-600 hover:text-slate-900">
                    <i class="fa-solid fa-file-signature"></i>
                    <span>模擬測驗</span>
                </button>
            </div>
        </div>

        <!-- Sticky Progress Bar Header -->
        <div class="bg-slate-50 border-t border-slate-100 px-4 py-2">
            <div class="max-w-5xl mx-auto flex items-center justify-between text-xs text-slate-600">
                <div class="flex items-center gap-4">
                    <span>進度: <strong id="progressText" class="text-slate-800">0/25</strong></span>
                    <span id="accuracyContainer" class="hidden sm:inline">正確率: <strong id="accuracyText" class="text-emerald-600">0%</strong></span>
                </div>
                <div class="flex items-center gap-3">
                    <button onclick="scrollToTop()" class="hover:text-brand-600 flex items-center gap-1">
                        <i class="fa-solid fa-arrow-up"></i> 回頂部
                    </button>
                    <button onclick="resetQuiz()" class="hover:text-rose-600 flex items-center gap-1 ml-2">
                        <i class="fa-solid fa-rotate-right"></i> 重置
                    </button>
                </div>
            </div>
            <!-- Progress Line -->
            <div class="max-w-5xl mx-auto w-full bg-slate-200 h-1.5 rounded-full mt-1 overflow-hidden">
                <div id="progressBar" class="bg-brand-500 h-full w-0 transition-all duration-300"></div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-6 flex flex-col md:flex-row gap-6">

        <!-- Questions Section -->
        <div class="flex-1 space-y-6" id="questionsContainer">
            <!-- Dynamic Questions insert here -->
        </div>

        <!-- Sidebar / Navigation Panel -->
        <aside class="w-full md:w-64 shrink-0">
            <div class="bg-white border border-slate-200 rounded-2xl p-4 sticky top-28 shadow-sm space-y-4">
                <h3 class="font-bold text-slate-700 text-sm flex items-center justify-between">
                    <span>題目導覽</span>
                    <span id="modeBadge" class="text-xs px-2 py-0.5 rounded-full bg-brand-50 text-brand-600 font-normal">練習模式</span>
                </h3>

                <!-- Grid Buttons -->
                <div id="navGrid" class="grid grid-cols-5 gap-2">
                    <!-- Dynamic Nav Buttons -->
                </div>

                <!-- Exam Mode Submit Button Container -->
                <div id="examSubmitContainer" class="pt-2 hidden border-t border-slate-100">
                    <button onclick="submitExam()" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-medium shadow-md shadow-emerald-600/20 transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-paper-plane"></i>
                        <span>繳交考卷</span>
                    </button>
                </div>

                <!-- Color Explanation -->
                <div class="text-xs text-slate-500 space-y-1.5 pt-2 border-t border-slate-100">
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-3 rounded bg-slate-100 border border-slate-300"></span>
                        <span>未答題</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-3 rounded bg-emerald-500"></span>
                        <span>答對 / 已選取</span>
                    </div>
                    <div class="flex items-center gap-2" id="wrongLegend">
                        <span class="w-3 h-3 rounded bg-rose-500"></span>
                        <span>答錯</span>
                    </div>
                </div>
            </div>
        </aside>
    </main>

    <!-- Results Modal / View -->
    <div id="resultModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50 opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-white rounded-3xl max-w-lg w-full p-6 md:p-8 shadow-2xl transform scale-95 transition-transform duration-300 space-y-6" id="resultModalContent">
            <div class="text-center space-y-2">
                <div class="w-16 h-16 rounded-full bg-brand-50 text-brand-500 flex items-center justify-center text-3xl mx-auto shadow-inner">
                    <i class="fa-solid fa-trophy"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-800">模擬測驗完成！</h2>
                <p class="text-slate-500 text-sm">辛苦了！以下是您的成績總覽：</p>
            </div>

            <!-- Score Cards -->
            <div class="grid grid-cols-3 gap-3 text-center">
                <div class="bg-slate-50 p-3 rounded-2xl border border-slate-100">
                    <div class="text-xs text-slate-400">總得分</div>
                    <div class="text-2xl font-extrabold text-brand-600 mt-0.5"><span id="scoreVal">0</span><span class="text-xs font-normal text-slate-400">分</span></div>
                </div>
                <div class="bg-emerald-50 p-3 rounded-2xl border border-emerald-100">
                    <div class="text-xs text-emerald-600">答對題數</div>
                    <div class="text-2xl font-extrabold text-emerald-600 mt-0.5" id="correctCountVal">0</div>
                </div>
                <div class="bg-rose-50 p-3 rounded-2xl border border-rose-100">
                    <div class="text-xs text-rose-600">答錯題數</div>
                    <div class="text-2xl font-extrabold text-rose-600 mt-0.5" id="wrongCountVal">0</div>
                </div>
            </div>

            <!-- Summary Feedback -->
            <div id="scoreFeedback" class="p-4 bg-slate-50 rounded-2xl text-sm text-slate-600 text-center">
                <!-- Dynamic feedback -->
            </div>

            <div class="flex gap-3">
                <button onclick="closeResultModal()" class="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-xl transition">
                    查看解析
                </button>
                <button onclick="resetQuiz()" class="flex-1 py-3 bg-brand-500 hover:bg-brand-600 text-white font-medium rounded-xl transition shadow-md shadow-brand-500/20">
                    重新測驗
                </button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-400 mt-auto">
        <p>建國國民中學 國三綜合練習題庫系統 • 線上自學輔助平台</p>
    </footer>

    <!-- JavaScript Data and Logic -->

                options: [
                    "(A) 一位能力極強的王牌業務員，她的荷倫碼是 ESC",

                    "(C) 一位精算財務、重視秩序且細心維護帳目的資深會計師，她的荷倫碼是 AIR",

        // System State Variables
        let currentMode = 'practice'; // 'practice' or 'exam'
        let userAnswers = {}; // { qId: selectedOptionIndex }
        let examSubmitted = false;

        // Init App
        window.onload = function() {
            renderQuestions();
            renderNavGrid();
            updateProgress();
        };

        // Render All Questions
        function renderQuestions() {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';

            questionsData.forEach((q, index) => {
                const card = document.createElement('div');
                card.id = `question-card-${q.id}`;
                card.className = "bg-white border border-slate-200 rounded-2xl p-5 md:p-6 shadow-sm transition-all duration-200 hover:shadow-md";

                // Question Title & Header
                let html = `
                    <div class="flex items-start justify-between gap-3 mb-4">
                        <span class="inline-block px-3 py-1 bg-slate-100 text-slate-700 font-bold text-xs rounded-lg shrink-0">
                            第 ${q.id} 題
                        </span>
                        <div id="status-badge-${q.id}" class="hidden text-xs font-semibold px-2.5 py-0.5 rounded-full"></div>
                    </div>
                    <div class="text-slate-800 font-medium text-base md:text-lg mb-5 leading-relaxed">
                        ${q.question}
                    </div>
                    <div class="space-y-2.5">
                `;

                // Options
                q.options.forEach((opt, optIndex) => {
                    html += `
                        <button id="opt-${q.id}-${optIndex}" onclick="selectOption(${q.id}, ${optIndex})" 
                            class="option-btn w-full text-left p-3.5 rounded-xl border border-slate-200 text-sm md:text-base text-slate-700 hover:border-brand-500 hover:bg-brand-50/50 transition-all flex items-start gap-3">
                            <span class="w-5 h-5 rounded-full border border-slate-300 shrink-0 flex items-center justify-center text-xs mt-0.5 option-indicator"></span>
                            <span>${opt}</span>
                        </button>
                    `;
                });

                html += `</div>`;

                // Explanation Block (hidden by default in exam mode or until answered in practice)
                html += `
                    <div id="explanation-${q.id}" class="hidden mt-5 p-4 bg-amber-50 border border-amber-200/70 rounded-xl text-sm text-slate-700 leading-relaxed">
                        <div class="font-bold text-amber-800 mb-1 flex items-center gap-1.5">
                            <i class="fa-solid fa-lightbulb"></i>
                            <span>題目解析</span>
                        </div>
                        <div>${q.explanation}</div>
                    </div>
                `;

                card.innerHTML = html;
                container.appendChild(card);
            });
        }

        // Render Sidebar Navigation Grid
        function renderNavGrid() {
            const grid = document.getElementById('navGrid');
            grid.innerHTML = '';

            questionsData.forEach(q => {
                const btn = document.createElement('button');
                btn.id = `nav-btn-${q.id}`;
                btn.onclick = () => scrollToQuestion(q.id);
                btn.className = "w-full aspect-square rounded-xl text-xs font-semibold flex items-center justify-center border transition-all duration-150 bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100";
                btn.innerText = q.id;
                grid.appendChild(btn);
            });
        }

        // Select Option Handler
        function selectOption(qId, optIndex) {
            if (currentMode === 'exam' && examSubmitted) return;

            const q = questionsData.find(item => item.id === qId);
            userAnswers[qId] = optIndex;

            // UI update for options
            q.options.forEach((_, idx) => {
                const btn = document.getElementById(`opt-${qId}-${idx}`);
                const indicator = btn.querySelector('.option-indicator');

                // Reset styles
                btn.className = "option-btn w-full text-left p-3.5 rounded-xl border text-sm md:text-base transition-all flex items-start gap-3 border-slate-200 text-slate-700 hover:border-brand-500 hover:bg-brand-50/50";
                indicator.className = "w-5 h-5 rounded-full border border-slate-300 shrink-0 flex items-center justify-center text-xs mt-0.5 option-indicator";
                indicator.innerHTML = '';

                if (idx === optIndex) {
                    if (currentMode === 'practice') {
                        const isCorrect = (optIndex === q.answer);
                        if (isCorrect) {
                            btn.className = "option-btn w-full text-left p-3.5 rounded-xl border text-sm md:text-base transition-all flex items-start gap-3 bg-emerald-50 border-emerald-500 text-emerald-900 font-medium";
                            indicator.className = "w-5 h-5 rounded-full bg-emerald-500 border border-emerald-500 shrink-0 flex items-center justify-center text-xs mt-0.5 text-white option-indicator";
                            indicator.innerHTML = '<i class="fa-solid fa-check"></i>';
                        } else {
                            btn.className = "option-btn w-full text-left p-3.5 rounded-xl border text-sm md:text-base transition-all flex items-start gap-3 bg-rose-50 border-rose-500 text-rose-900 font-medium";
                            indicator.className = "w-5 h-5 rounded-full bg-rose-500 border border-rose-500 shrink-0 flex items-center justify-center text-xs mt-0.5 text-white option-indicator";
                            indicator.innerHTML = '<i class="fa-solid fa-xmark"></i>';
                        }
                    } else {
                        // Exam Mode - Selected state
                        btn.className = "option-btn w-full text-left p-3.5 rounded-xl border text-sm md:text-base transition-all flex items-start gap-3 bg-brand-50 border-brand-500 text-brand-900 font-medium";
                        indicator.className = "w-5 h-5 rounded-full bg-brand-500 border border-brand-500 shrink-0 flex items-center justify-center text-xs mt-0.5 text-white option-indicator";
                        indicator.innerHTML = '<i class="fa-solid fa-circle text-[8px]"></i>';
                    }
                } else if (currentMode === 'practice' && idx === q.answer && userAnswers[qId] !== undefined) {
                    // Show correct answer in practice mode when wrong option is picked
                    btn.className = "option-btn w-full text-left p-3.5 rounded-xl border text-sm md:text-base transition-all flex items-start gap-3 bg-emerald-50/60 border-emerald-300 text-emerald-800 font-medium";
                    indicator.className = "w-5 h-5 rounded-full border border-emerald-400 shrink-0 flex items-center justify-center text-xs mt-0.5 text-emerald-600 option-indicator";
                    indicator.innerHTML = '<i class="fa-solid fa-check"></i>';
                }
            });

            // Handle Practice Mode Immediate Feedback & Explanation
            if (currentMode === 'practice') {
                const isCorrect = (optIndex === q.answer);
                const expEl = document.getElementById(`explanation-${qId}`);
                expEl.classList.remove('hidden');

                const statusBadge = document.getElementById(`status-badge-${qId}`);
                statusBadge.classList.remove('hidden', 'bg-emerald-100', 'text-emerald-700', 'bg-rose-100', 'text-rose-700');
                if (isCorrect) {
                    statusBadge.classList.add('bg-emerald-100', 'text-emerald-700');
                    statusBadge.innerText = '答對';
                } else {
                    statusBadge.classList.add('bg-rose-100', 'text-rose-700');
                    statusBadge.innerText = '答錯';
                }
            }

            updateProgress();
            updateNavGridStatus();
        }

        // Update Nav Grid Color Indicators
        function updateNavGridStatus() {
            questionsData.forEach(q => {
                const btn = document.getElementById(`nav-btn-${q.id}`);
                const answered = userAnswers[q.id] !== undefined;

                if (!answered) {
                    btn.className = "w-full aspect-square rounded-xl text-xs font-semibold flex items-center justify-center border transition-all duration-150 bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100";
                    return;
                }

                if (currentMode === 'practice') {
                    const isCorrect = (userAnswers[q.id] === q.answer);
                    if (isCorrect) {
                        btn.className = "w-full aspect-square rounded-xl text-xs font-semibold flex items-center justify-center border transition-all duration-150 bg-emerald-500 border-emerald-500 text-white shadow-xs";
                    } else {
                        btn.className = "w-full aspect-square rounded-xl text-xs font-semibold flex items-center justify-center border transition-all duration-150 bg-rose-500 border-rose-500 text-white shadow-xs";
                    }
                } else {
                    if (examSubmitted) {
                        const isCorrect = (userAnswers[q.id] === q.answer);
                        if (isCorrect) {
                            btn.className = "w-full aspect-square rounded-xl text-xs font-semibold flex items-center justify-center border transition-all duration-150 bg-emerald-500 border-emerald-500 text-white";
                        } else {
                            btn.className = "w-full aspect-square rounded-xl text-xs font-semibold flex items-center justify-center border transition-all duration-150 bg-rose-500 border-rose-500 text-white";
                        }
                    } else {
                        btn.className = "w-full aspect-square rounded-xl text-xs font-semibold flex items-center justify-center border transition-all duration-150 bg-brand-500 border-brand-500 text-white";
                    }
                }
            });
        }

        // Update Progress Bar & Accuracy
        function updateProgress() {
            const answeredCount = Object.keys(userAnswers).length;
            const total = questionsData.length;
            const percentage = Math.round((answeredCount / total) * 100);

            document.getElementById('progressText').innerText = `${answeredCount}/${total}`;
            document.getElementById('progressBar').style.width = `${percentage}%`;

            // Calculate accuracy
            if (currentMode === 'practice' && answeredCount > 0) {
                let correctCount = 0;
                Object.keys(userAnswers).forEach(qId => {
                    const q = questionsData.find(item => item.id == qId);
                    if (userAnswers[qId] === q.answer) correctCount++;
                });
                const accuracy = Math.round((correctCount / answeredCount) * 100);
                document.getElementById('accuracyText').innerText = `${accuracy}%`;
            } else {
                document.getElementById('accuracyText').innerText = `0%`;
            }
        }

        // Switch System Mode
        function switchMode(mode) {
            currentMode = mode;
            const practiceBtn = document.getElementById('modePracticeBtn');
            const examBtn = document.getElementById('modeExamBtn');
            const examSubmitContainer = document.getElementById('examSubmitContainer');
            const modeBadge = document.getElementById('modeBadge');
            const accuracyContainer = document.getElementById('accuracyContainer');
            const wrongLegend = document.getElementById('wrongLegend');

            if (mode === 'practice') {
                practiceBtn.className = "px-3 py-1.5 rounded-lg text-sm font-medium transition-all duration-200 flex items-center gap-1.5 shadow-xs bg-white text-brand-600";
                examBtn.className = "px-3 py-1.5 rounded-lg text-sm font-medium transition-all duration-200 flex items-center gap-1.5 text-slate-600 hover:text-slate-900";
                examSubmitContainer.classList.add('hidden');
                modeBadge.innerText = '練習模式';
                modeBadge.className = "text-xs px-2 py-0.5 rounded-full bg-brand-50 text-brand-600 font-normal";
                accuracyContainer.classList.remove('hidden');
                wrongLegend.classList.remove('hidden');
            } else {
                examBtn.className = "px-3 py-1.5 rounded-lg text-sm font-medium transition-all duration-200 flex items-center gap-1.5 shadow-xs bg-white text-brand-600";
                practiceBtn.className = "px-3 py-1.5 rounded-lg text-sm font-medium transition-all duration-200 flex items-center gap-1.5 text-slate-600 hover:text-slate-900";
                examSubmitContainer.classList.remove('hidden');
                modeBadge.innerText = '模擬測驗';
                modeBadge.className = "text-xs px-2 py-0.5 rounded-full bg-amber-50 text-amber-600 font-normal";
                accuracyContainer.classList.add('hidden');
                wrongLegend.classList.add('hidden');
            }

            resetQuiz();
        }

        // Submit Exam Handler
        function submitExam() {
            const totalQuestions = questionsData.length;
            const answeredCount = Object.keys(userAnswers).length;

            if (answeredCount < totalQuestions) {
                if (!confirm(`您還有 ${totalQuestions - answeredCount} 題尚未回答，確定要提交考卷嗎？`)) {
                    return;
                }
            }

            examSubmitted = true;
            let correctCount = 0;

            // Grade Exam & Reveal Explanations
            questionsData.forEach(q => {
                const userAns = userAnswers[q.id];
                const expEl = document.getElementById(`explanation-${q.id}`);
                const statusBadge = document.getElementById(`status-badge-${q.id}`);

                expEl.classList.remove('hidden');

                if (userAns !== undefined) {
                    const isCorrect = (userAns === q.answer);
                    if (isCorrect) correctCount++;

                    // Style options
                    q.options.forEach((_, idx) => {
                        const btn = document.getElementById(`opt-${q.id}-${idx}`);
                        const indicator = btn.querySelector('.option-indicator');

                        if (idx === q.answer) {
                            btn.className = "option-btn w-full text-left p-3.5 rounded-xl border text-sm md:text-base flex items-start gap-3 bg-emerald-50 border-emerald-500 text-emerald-900 font-medium";
                            indicator.className = "w-5 h-5 rounded-full bg-emerald-500 border border-emerald-500 flex items-center justify-center text-xs mt-0.5 text-white option-indicator";
                            indicator.innerHTML = '<i class="fa-solid fa-check"></i>';
                        } else if (idx === userAns && !isCorrect) {
                            btn.className = "option-btn w-full text-left p-3.5 rounded-xl border text-sm md:text-base flex items-start gap-3 bg-rose-50 border-rose-500 text-rose-900 font-medium";
                            indicator.className = "w-5 h-5 rounded-full bg-rose-500 border border-rose-500 flex items-center justify-center text-xs mt-0.5 text-white option-indicator";
                            indicator.innerHTML = '<i class="fa-solid fa-xmark"></i>';
                        }
                    });

                    statusBadge.classList.remove('hidden');
                    if (isCorrect) {
                        statusBadge.className = 'text-xs font-semibold px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-700';
                        statusBadge.innerText = '答對';
                    } else {
                        statusBadge.className = 'text-xs font-semibold px-2.5 py-0.5 rounded-full bg-rose-100 text-rose-700';
                        statusBadge.innerText = '答錯';
                    }
                } else {
                    // Unanswered
                    statusBadge.classList.remove('hidden');
                    statusBadge.className = 'text-xs font-semibold px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-600';
                    statusBadge.innerText = '未答';

                    // Highlight correct answer
                    const btn = document.getElementById(`opt-${q.id}-${q.answer}`);
                    const indicator = btn.querySelector('.option-indicator');
                    btn.className = "option-btn w-full text-left p-3.5 rounded-xl border text-sm md:text-base flex items-start gap-3 bg-emerald-50/60 border-emerald-300 text-emerald-800 font-medium";
                    indicator.className = "w-5 h-5 rounded-full border border-emerald-400 flex items-center justify-center text-xs mt-0.5 text-emerald-600 option-indicator";
                    indicator.innerHTML = '<i class="fa-solid fa-check"></i>';
                }
            });

            // Show wrong legend in exam sidebar after submission
            document.getElementById('wrongLegend').classList.remove('hidden');
            updateNavGridStatus();

            // Calculate Score (4 pts per question)
            const score = correctCount * 4;
            const wrongCount = totalQuestions - correctCount;

            // Show Result Modal
            document.getElementById('scoreVal').innerText = score;
            document.getElementById('correctCountVal').innerText = correctCount;
            document.getElementById('wrongCountVal').innerText = wrongCount;

            let feedbackText = "";
            if (score === 100) {
                feedbackText = "🎉 太棒了！完美拿滿分！準備非常充實！";
            } else if (score >= 80) {
                feedbackText = "👍 表現優異！觀念相當清晰，再細心檢視錯題即可！";
            } else if (score >= 60) {
                feedbackText = "更上層樓！已經掌握大部分重點，建議仔細閱讀解析進行補強！";
            } else {
                feedbackText = "💪 加油！建議切換至「練習模式」重新溫習生涯金三角與筆記法概念！";
            }
            document.getElementById('scoreFeedback').innerText = feedbackText;

            showResultModal();
        }

        // Show/Close Result Modal
        function showResultModal() {
            const modal = document.getElementById('resultModal');
            const content = document.getElementById('resultModalContent');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            content.classList.remove('scale-95');
            content.classList.add('scale-100');
        }

        function closeResultModal() {
            const modal = document.getElementById('resultModal');
            const content = document.getElementById('resultModalContent');
            modal.classList.add('opacity-0', 'pointer-events-none');
            content.classList.remove('scale-100');
            content.classList.add('scale-95');
        }

        // Reset Quiz State
        function resetQuiz() {
            userAnswers = {};
            examSubmitted = false;
            renderQuestions();
            renderNavGrid();
            updateProgress();
            scrollToTop();
        }

        // Scroll Helpers
        function scrollToQuestion(id) {
            const el = document.getElementById(`question-card-${id}`);
            if (el) {
                const yOffset = -110; 
                const y = el.getBoundingClientRect().top + window.pageYOffset + yOffset;
                window.scrollTo({ top: y, behavior: 'smooth' });
            }
        }

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
