                    {/* 下方分頁按鈕控制 */}
                    <div className="flex justify-between items-center mt-6 pt-4 border-t border-slate-100">
                      <button
                        onClick={() => {
                          setCurrentIndex(prev => Math.max(0, prev - 1));
                          setShowHint(false);
                          if (mode === 'practice') setShowExplanation(!!userAnswers[quizQuestions[currentIndex - 1]?.id]);
                        }}
                        disabled={currentIndex === 0}
                        className="px-4 py-2 rounded-xl text-sm font-bold bg-slate-100 text-slate-600 hover:bg-slate-200 disabled:opacity-40 disabled:cursor-not-allowed transition flex items-center gap-1">
                        <i data-lucide="chevron-left" className="w-4 h-4"></i>
                        <span>上一題</span>
                      </button>

                      <div className="text-xs text-slate-400 font-medium hidden sm:block">
                        答題進度: {Object.keys(userAnswers).length} / {quizQuestions.length}
                      </div>

                      {currentIndex < quizQuestions.length - 1 ? (
                        <button
                          onClick={() => {
                            setCurrentIndex(prev => Math.min(quizQuestions.length - 1, prev + 1));
                            setShowHint(false);
                            if (mode === 'practice') setShowExplanation(!!userAnswers[quizQuestions[currentIndex + 1]?.id]);
                          }}
                          className="px-5 py-2 rounded-xl text-sm font-bold bg-indigo-600 text-white hover:bg-indigo-700 transition flex items-center gap-1 shadow-md">
                          <span>下一題</span>
                          <i data-lucide="chevron-right" className="w-4 h-4"></i>
                        </button>
                      ) : (
                        mode === 'exam' ? (
                          <button
                            onClick={handleSubmitExam}
                            className="px-5 py-2 rounded-xl text-sm font-bold bg-emerald-600 text-white hover:bg-emerald-700 transition flex items-center gap-1 shadow-md">
                            <i data-lucide="send" className="w-4 h-4"></i>
                            <span>確認交卷</span>
                          </button>
                        ) : (
                          <button
                            onClick={() => setMode('home')}
                            className="px-5 py-2 rounded-xl text-sm font-bold bg-slate-800 text-white hover:bg-slate-900 transition">
                            完成練習
                          </button>
                        )
                      )}
                    </div>

                  </div>
                </div>

                {/* 右側導覽畫板 (佔 1 欄) */}
                <div className="lg:col-span-1">
                  <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 sticky top-20">
                    <h4 className="font-bold text-slate-700 text-sm mb-3 flex items-center justify-between">
                      <span>試題導覽</span>
                      <span className="text-xs font-normal text-slate-500">共 {quizQuestions.length} 題</span>
                    </h4>

                    {/* 答題卡 Grid */}
                    <div className="grid grid-cols-5 gap-2 max-h-80 overflow-y-auto custom-scrollbar p-1">
                      {quizQuestions.map((q, idx) => {
                        const isAnswered = !!userAnswers[q.id];
                        const isCurrent = idx === currentIndex;
                        const isFlagged = flagged[q.id];

                        let statusBg = "bg-slate-100 text-slate-600 border-slate-200";
                        if (isCurrent) {
                          statusBg = "bg-indigo-600 text-white font-bold ring-2 ring-indigo-300 border-indigo-600";
                        } else if (isAnswered) {
                          statusBg = "bg-emerald-100 text-emerald-700 border-emerald-300 font-semibold";
                        }

                        return (
                          <button
                            key={q.id}
                            onClick={() => {
                              setCurrentIndex(idx);
                              setShowHint(false);
                              if (mode === 'practice') setShowExplanation(!!userAnswers[q.id]);
                            }}
                            className={`h-9 rounded-lg text-xs border flex items-center justify-center relative transition ${statusBg}`}>
                            {idx + 1}
                            {isFlagged && (
                              <span className="absolute -top-1 -right-1 w-2.5 h-2.5 bg-amber-500 rounded-full"></span>
                            )}
                          </button>
                        );
                      })}
                    </div>

                    {/* 狀態說明 */}
                    <div className="mt-4 pt-3 border-t border-slate-100 text-xs text-slate-500 space-y-1.5">
                      <div className="flex items-center gap-2">
                        <span className="w-3 h-3 rounded bg-indigo-600 inline-block"></span>
                        <span>當前選取題目</span>
                      </div>
                      <div className="flex items-center gap-2">
                        <span className="w-3 h-3 rounded bg-emerald-100 border border-emerald-300 inline-block"></span>
                        <span>已作答題目</span>
                      </div>
                      {mode === 'exam' && (
                        <div className="flex items-center gap-2">
                          <span className="w-3 h-3 rounded bg-amber-500 inline-block"></span>
                          <span>標記劃記題號</span>
                        </div>
                      )}
                    </div>

                    {/* 考試模式的提交按鈕 */}
                    {mode === 'exam' && (
                      <button
                        onClick={handleSubmitExam}
                        className="w-full mt-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold rounded-xl transition shadow-md flex items-center justify-center gap-1.5">
                        <i data-lucide="check-square" className="w-4 h-4"></i>
                        <span>立即交卷</span>
                      </button>
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* 成績結算與檢討畫面 (Exam Result) */}
            {mode === 'result' && (
              <div className="max-w-4xl mx-auto w-full space-y-6">
                
                {/* 成績總覽 Card */}
                <div className="bg-white rounded-2xl p-6 md:p-8 shadow-md border border-slate-200 text-center relative overflow-hidden">
                  <div className="absolute top-0 left-0 w-full h-3 bg-gradient-to-r from-indigo-500 via-purple-500 to-emerald-500"></div>
                  
                  <span className="text-xs font-bold uppercase tracking-wider text-slate-400">測驗成績總覽</span>
                  <div className="text-5xl md:text-6xl font-black text-indigo-700 my-3">
                    {scoreAnalysis.score} <span className="text-2xl text-slate-400 font-normal">分</span>
                  </div>
                  
                  <p className="text-slate-600 text-sm">
                    答對 {scoreAnalysis.correctCount} 題，共 {scoreAnalysis.total} 題 （答對率 {Math.round((scoreAnalysis.correctCount / scoreAnalysis.total) * 100)}%）
                  </p>

                  <div className="flex justify-center gap-4 mt-6">
                    <button
                      onClick={startExam}
                      className="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl transition text-sm flex items-center gap-2 shadow-sm">
                      <i data-lucide="rotate-ccw" className="w-4 h-4"></i>
                      <span>重新測驗</span>
                    </button>
                    <button
                      onClick={() => setMode('home')}
                      className="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl transition text-sm">
                      返回首頁
                    </button>
                  </div>
                </div>

                {/* 逐題檢討清單 */}
                <div className="bg-white rounded-2xl p-6 shadow-md border border-slate-200">
                  <h3 className="font-bold text-lg text-slate-800 mb-4 flex items-center gap-2">
                    <i data-lucide="list-checks" className="w-5 h-5 text-indigo-600"></i>
                    <span>試題檢討與觀念解析</span>
                  </h3>

                  <div className="space-y-6">
                    {quizQuestions.map((q, idx) => {
                      const userAns = userAnswers[q.id];
                      const isCorrect = userAns === q.answer;

                      return (
                        <div 
                          key={q.id} 
                          className={`p-5 rounded-xl border-2 transition ${
                            isCorrect ? 'border-emerald-200 bg-emerald-50/30' : 'border-rose-200 bg-rose-50/30'
                          }`}>
                          <div className="flex items-start justify-between gap-3 mb-2">
                            <span className="font-bold text-slate-800 text-base">
                              第 {idx + 1} 題：{q.question}
                            </span>
                            <span className={`px-2.5 py-1 rounded-full text-xs font-bold shrink-0 ${
                              isCorrect ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'
                            }`}>
                              {isCorrect ? '答對' : '答錯'}
                            </span>
                          </div>

                          {/* 題目圖示 */}
                          {q.hasCustomImage === 'Q4' && <EyeImagingQ4 />}
                          {q.hasCustomImage === 'Q16' && <EarStructureQ16 />}

                          {/* 選項展示 */}
                          <div className="grid grid-cols-1 md:grid-cols-2 gap-2 my-3">
                            {q.options.map(opt => {
                              let optionClass = "bg-white border-slate-200 text-slate-600";
                              if (opt.label === q.answer) {
                                optionClass = "bg-emerald-100 border-emerald-400 text-emerald-900 font-bold";
                              } else if (opt.label === userAns && !isCorrect) {
                                optionClass = "bg-rose-100 border-rose-400 text-rose-900 font-bold";
                              }

                              return (
                                <div key={opt.label} className={`p-2.5 rounded-lg border text-xs flex items-center gap-2 ${optionClass}`}>
                                  <span className="font-bold">{opt.label}.</span>
                                  <span>{opt.text}</span>
                                </div>
                              );
                            })}
                          </div>

                          {/* 解析 */}
                          <div className="mt-3 p-3 bg-slate-800 text-white rounded-lg text-xs leading-relaxed">
                            <span className="text-emerald-400 font-bold block mb-1">觀念解析：</span>
                            {q.rationale}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

              </div>
            )}

          </main>

          {/* Footer */}
          <footer className="bg-white border-t border-slate-200 py-4 mt-auto">
            <div className="max-w-5xl mx-auto px-4 text-center text-xs text-slate-500">
              國中健康與體育數位學習題庫系統 &copy; 2026 翰林出版試卷數位化版本
            </div>
          </footer>
        </div>
      );
    }

    // 渲染 React 應用
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

    // 初始化 Lucide 圖示
    setTimeout(() => {
      if (window.lucide) {
        window.lucide.createIcons();
      }
    }, 200);
  </script>
</body>
</html>
