        function updateProgress() {
            let answeredCount = 0;
            
            // 計算 25 題選擇題
            for (let i = 1; i <= 25; i++) {
                if (userAnswers[i] !== undefined) answeredCount++;
            }
            
            // 計算 5 題簡答題
            for (let i = 26; i <= 30; i++) {
                const input = document.getElementById(`sa-input-${i}`);
                if (input && input.value.trim().length > 0) answeredCount++;
            }

            document.getElementById("progress-text").innerText = answeredCount;
            const percentage = (answeredCount / 30) * 100;
            document.getElementById("progress-bar").style.width = `${percentage}%`;
        }

        // 提交測驗
        function submitQuiz() {
            if (isSubmitted) {
                window.scrollTo({ top: 0, behavior: 'smooth' });
                return;
            }

            // 檢查是否全部完成
            let unanswered = [];
            for (let i = 1; i <= 25; i++) {
                if (userAnswers[i] === undefined) unanswered.push(i);
            }

            if (unanswered.length > 0) {
                showModal("尚未完成所有選擇題", `您還有 ${unanswered.length} 題選擇題未作答（例如：第 ${unanswered.slice(0, 3).join(", ")} 題）。建議填寫完整以獲得準確成績。`, "仍要提交", () => processSubmission());
                return;
            }

            processSubmission();
        }

        // 處理提交邏輯
        function processSubmission() {
            closeModal();
            isSubmitted = true;

            let score = 0;
            let correctCount = 0;

            // 計分與顯示對錯樣式
            quizData.forEach(sec => {
                sec.items.forEach(item => {
                    if (item.type === 'mcq') {
                        const userAns = userAnswers[item.id];
                        const isCorrect = userAns === item.answer;
                        const statusTag = document.getElementById(`status-tag-${item.id}`);
                        
                        statusTag.classList.remove("hidden");
                        
                        if (isCorrect) {
                            score += 4;
                            correctCount++;
                            statusTag.classList.add("bg-emerald-100", "text-emerald-700");
                            statusTag.innerHTML = `<i class="fa-solid fa-check mr-1"></i>答對 (4分)`;
                        } else {
                            statusTag.classList.add("bg-rose-100", "text-rose-700");
                            statusTag.innerHTML = `<i class="fa-solid fa-xmark mr-1"></i>答錯 (0分)`;
                        }

                        // 標示選項顏色
                        item.options.forEach((_, oIdx) => {
                            const label = document.getElementById(`opt-label-${item.id}-${oIdx}`);
                            const input = label.querySelector("input");
                            input.disabled = true;

                            if (oIdx === item.answer) {
                                // 正確答案顯示綠色
                                label.classList.add("bg-emerald-50", "border-emerald-500", "text-emerald-900", "font-semibold");
                                label.classList.remove("border-slate-200");
                            } else if (oIdx === userAns && !isCorrect) {
                                // 學生選錯的顯示紅色
                                label.classList.add("bg-rose-50", "border-rose-400", "text-rose-900");
                                label.classList.remove("border-slate-200");
                            }
                        });
                    } else if (item.type === 'sa') {
                        const textarea = document.getElementById(`sa-input-${item.id}`);
                        if (textarea) textarea.readOnly = true;
                    }

                    // 展開解析
                    const expBox = document.getElementById(`exp-${item.id}`);
                    if (expBox) expBox.classList.remove("hidden");
                });
            });

            // 填寫結果卡片資訊
            const className = document.getElementById("student-class").value || "未填寫班級";
            const studentNo = document.getElementById("student-no").value || "";
            const studentName = document.getElementById("student-name").value || "同學";

            document.getElementById("result-student-info").innerText = `${className} ${studentNo}號 ${studentName}`;
            document.getElementById("final-score").innerText = score;
            document.getElementById("correct-count").innerText = correctCount;

            // 評語判定
            let evalText = "";
            if (score >= 90) evalText = "🌟 太棒了！您對全球地理、財經決策與人生理財概念有極其出色的理解！";
            else if (score >= 75) evalText = "👍 表現優良！您已掌握大部分核心概念，可細讀解析深化觀念。";
            else if (score >= 60) evalText = "📚 順利及格！建議對照答案解析，加強資產配置與機會成本的理解。";
            else evalText = "💪 仍需努力！請認真研讀下方詳細解析，汲取寶貴的人生成敗經驗。";

            document.getElementById("result-grade-eval").innerText = evalText;

            // 顯示結果卡片
            const resultCard = document.getElementById("result-card");
            resultCard.classList.remove("hidden");

            // 修改提交按鈕狀態
            const submitBtn = document.getElementById("submit-btn");
            submitBtn.innerHTML = `<i class="fa-solid fa-check-double mr-2"></i> 已完成測驗 (捲至頂部查看成績)`;
            submitBtn.classList.remove("from-brand-600", "to-indigo-600");
            submitBtn.classList.add("from-slate-600", "to-slate-700");

            // 滾動回頂部
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 綁定鍵盤/事件
        function bindEvents() {
            // 自動偵測輸入更新個人資訊
        }

        // Modal 彈窗控制
        function showModal(title, desc, confirmText, onConfirm) {
            document.getElementById("modal-title").innerText = title;
            document.getElementById("modal-desc").innerText = desc;
            const confirmBtn = document.getElementById("modal-confirm-btn");
            confirmBtn.innerText = confirmText;
            confirmBtn.onclick = onConfirm;
            document.getElementById("custom-modal").classList.remove("hidden");
        }

        function closeModal() {
            document.getElementById("custom-modal").classList.add("hidden");
        }

        // 重置測驗
        function confirmReset() {
            showModal("確定要重新作答？", "這將清除現有的選項與成績，讓您重新進行一次測驗。", "重新作答", () => {
                location.reload();
            });
        }
    </script>
</body>
</html>
